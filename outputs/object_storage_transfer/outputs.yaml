name: '@facets/object_storage_transfer'
properties:
  type: object
  properties:
    attributes:
      type: object
      properties:
        transfer_job_name:
          type: string
          description: Name of the GCP Storage Transfer job.
        transfer_job_description:
          type: string
          description: Description of the transfer job.
        status:
          type: string
          description: Transfer job status (ENABLED / DISABLED).
        aws_role_arn:
          type: string
          description: ARN of the AWS IAM role the Google service agent assumes to read the source bucket.
        aws_role_name:
          type: string
          description: Name of the AWS IAM role.
        aws_policy_arn:
          type: string
          description: ARN of the AWS IAM policy granting source-bucket read.
        source_bucket:
          type: string
          description: Source AWS S3 bucket.
        source_prefix:
          type: string
          description: Source object prefix.
        target_project_id:
          type: string
          description: GCP project id owning the destination bucket.
        target_bucket:
          type: string
          description: Destination GCS bucket.
        target_prefix:
          type: string
          description: Destination object prefix.
        mode:
          type: string
          description: Schedule mode (e.g. one-time or recurring).
        repeat_interval:
          type: string
          description: Repeat interval for recurring transfers.
    interfaces:
      type: object
      properties:
        transfer:
          type: object
          properties:
            job_name:
              type: string
            source_bucket:
              type: string
            source_prefix:
              type: string
            target_bucket:
              type: string
            target_prefix:
              type: string
            target_project_id:
              type: string
providers: []
