name: '@facets/argo_service'
properties:
  type: object
  properties:
    attributes:
      type: object
      properties:
        applicationset_name:
          type: string
          description: Name of the ArgoCD ApplicationSet managing this service.
        application_name:
          type: string
          description: Name of the Application generated by the ApplicationSet.
        argocd_project:
          type: string
          description: ArgoCD project (AppProject) the Application belongs to.
        argocd_namespace:
          type: string
          description: Namespace ArgoCD itself runs in, where the ApplicationSet is created.
        resource_name:
          type: string
          description: >-
            Name of the deployed Argo service. Retained from @facets/argo_service
            v1 for backward compatibility; equal to service_name.
        resource_namespace:
          type: string
          description: Kubernetes namespace the chart is deployed into.
        service_name:
          type: string
          description: Logical service name (the blueprint resource name).
        release_name:
          type: string
          description: >-
            Helm release name of the generated Application. Together with the
            target namespace this is the key facets-argo-shim matches on.
        chart_repo_url:
          type: string
          description: Git URL of the Helm charts repository.
        chart_path:
          type: string
          description: Path to the Helm chart within the charts repo.
        target_revision:
          type: string
          description: Branch, tag, or commit of the charts repo being tracked.
        values_path:
          type: string
          description: Values file path, relative to the chart directory.
    interfaces:
      type: object
      properties: {}
providers: []
