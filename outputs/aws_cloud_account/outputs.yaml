name: '@facets/aws_cloud_account'
properties:
  type: object
  properties:
    attributes:
      type: object
      properties:
        aws_iam_role:
          description: AWS IAM role ARN (sensitive)
          type: string
        aws_region:
          description: AWS region
          type: string
        external_id:
          description: External ID for role assumption (sensitive)
          type: string
        session_name:
          description: AWS session name with UUID
          type: string
    interfaces:
      type: object
      properties: {}
providers:
- name: aws
  source: hashicorp/aws
  version: "= 6.9.0"
  attributes:
    region: attributes.aws_region
    skip_region_validation: true
    assume_role:
      role_arn: attributes.aws_iam_role
      session_name: attributes.session_name
      external_id: attributes.external_id
