intent: kubernetes_namespace
flavor: k8s_standard
version: '1.0'
description: Creates a Kubernetes namespace, named after the environment unless a name is set
intentDetails:
  type: Kubernetes Resources
  description: Create and manage a Kubernetes namespace
  displayName: Namespace
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/k8s_resource.svg
clouds:
- aws
- azure
- gcp
- kubernetes
inputs:
  kubernetes_details:
    optional: false
    type: '@facets/kubernetes-details'
    displayName: Kubernetes Cluster
    default:
      resource_type: kubernetes_cluster
      resource_name: default
    providers:
    - kubernetes
spec:
  type: object
  properties:
    name:
      type: string
      title: Namespace Name
      description: Name of the namespace. Leave empty to use the environment name.
      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$
      maxLength: 63
outputs:
  default:
    type: '@facets/kubernetes_namespace'
    title: Namespace Details
sample:
  kind: kubernetes_namespace
  flavor: k8s_standard
  version: '1.0'
  disabled: true
  spec: {}
