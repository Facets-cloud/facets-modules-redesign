intent: aws_iam_role
flavor: import
version: '1.0'
description: MANAGED true-import of an existing AWS IAM role plus its managed-policy
  attachments. Role attributes (name, assume-role policy JSON, max session, path,
  permissions boundary, tags) and the attached policy ARNs are driven by an env
  override carrying the exact live spec so a plan against the live role is 0-change.
intentDetails:
  type: Security
  description: Managed zero-change import of an existing AWS IAM role
  displayName: IAM Role (Import Existing)
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/aws_iam_role.svg
clouds:
- aws
spec:
  type: object
  properties:
    role:
      type: object
      x-ui-yaml-editor: true
      title: IAM role config (from live)
      x-ui-overrides-only: true
    policy_arns:
      type: array
      title: Attached managed-policy ARNs (from live)
      items:
        type: string
      x-ui-overrides-only: true
inputs:
  cloud_account:
    type: '@facets/aws_cloud_account'
    displayName: Cloud Account
    description: The AWS Cloud Account the role lives in
    optional: false
    providers:
    - aws
outputs:
  default:
    type: '@facets/aws_iam_role'
sample:
  kind: aws_iam_role
  flavor: import
  version: '1.0'
  spec: {}
iac:
  validated_files:
  - variables.tf
