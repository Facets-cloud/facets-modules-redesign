intent: service
flavor: import
version: '1.0'
description: MANAGED true-import of existing Facets `service` resources. In live these are deployed
  as Helm releases of the vendored app-chart (the legacy facets-iac application wrapper), so this
  flavor imports them as the same helm_release type, keyed by release name. The chart is vendored so
  chart name + version (app-chart 0.3.0) match live (import is 0-replace); the release name, namespace
  and the verbatim multi-file values list are driven by an env override carrying the live spec. The
  helm provider never reads values back on import, so the first plan shows a structural `+ values`
  populate only.
intentDetails:
  type: Kubernetes Resources
  description: Managed zero-change import of existing Facets service (app-chart) releases
  displayName: Service (Import Existing)
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/service.svg
clouds:
- aws
- azure
- gcp
- kubernetes
inputs:
  kubernetes_details:
    type: '@facets/kubernetes-details'
    displayName: Kubernetes Cluster
    optional: false
    default:
      resource_type: kubernetes_cluster
      resource_name: default
    providers:
    - kubernetes
    - kubernetes-alpha
    - helm
spec:
  type: object
  properties:
    releases:
      type: object
      title: Helm releases to adopt (from live)
      description: Map of Helm release name to {name, namespace, values_b64}.
      x-ui-overrides-only: true
outputs:
  default:
    type: '@facets/service'
sample:
  kind: service
  flavor: import
  version: '1.0'
  spec:
    releases: {}
iac:
  validated_files:
  - variables.tf
