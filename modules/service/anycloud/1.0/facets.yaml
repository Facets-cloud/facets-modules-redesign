sample:
    flavor: anycloud
    kind: service
    spec:
        enable_host_anti_affinity: false
        env:
            LOG_LEVEL: INFO
        init_containers: {}
        pod_distribution: {}
        pod_distribution_enabled: false
        release:
            strategy:
                type: RollingUpdate
        restart_policy: Always
        runtime:
            args: []
            autoscaling:
                cpu_threshold: "50"
                max: 1
                min: 1
                scaling_on: CPU
            command: []
            health_checks:
                liveness_check_type: None
                readiness_check_type: None
            ports: {}
            size:
                cpu: 300m
                cpu_limit: 1000m
                memory: 1Gi
                memory_limit: 5Gi
        sidecars: {}
        type: application
    version: "1.0"
