intent: service
flavor: argo
version: '1.0'
description: 'Deploys a service to Kubernetes through ArgoCD as an ApplicationSet, with the facets-argo-shim
  identity annotations injected so ${facets:...} references inside the deployed chart resolve against
  this project/environment. Reads the shim''s consumed-references callback back from spec.facets_references
  and folds a digest into the Application, so a Facets release that changes any referenced value re-renders
  the app in Argo. Cloud-agnostic: creates no cloud resources of its own, so it runs on GKE, EKS, AKS
  or any conformant cluster.'
clouds:
- kubernetes
- aws
- azure
- gcp
x-project-type: gcp
intentDetails:
  type: Kubernetes
  displayName: Service
  description: Deploy a service to Kubernetes via an ArgoCD ApplicationSet
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/service.svg
inputs:
  kubernetes_details:
    type: '@facets/kubernetes-details'
    optional: false
    displayName: Kubernetes Cluster
    description: Cluster the ApplicationSet and its Applications are created in.
    default:
      resource_type: kubernetes_cluster
      resource_name: default
    providers:
    - kubernetes
    - helm
  argo_stack:
    type: '@facets/argo-stack'
    optional: false
    displayName: Argo Stack
    description: The Argo stack this service is deployed through. Supplies the ArgoCD namespace, establishes
      the dependency so this module applies only after Argo is running, and publishes shim_enabled - which
      this module gates on when the service uses ${facets:...} references.
    default:
      resource_type: argo
      resource_name: default
artifact_inputs:
  primary:
    attribute_path: spec.release.image
    artifact_type: docker_image
outputs:
  default:
    type: '@facets/service'
    title: Service Output
    description: Kubernetes service deployment details.
spec:
  type: object
  title: Argo Service
  description: Deploys a Helm chart from a charts repository to this environment's cluster through an
    ArgoCD ApplicationSet.
  properties:
    argocd_project:
      title: ArgoCD Project
      description: ArgoCD project (AppProject) to assign the generated Application to.
      type: string
      default: default
      pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
    namespace:
      title: Target Namespace
      description: Kubernetes namespace the chart is deployed into. Created automatically (CreateNamespace=true
        is always set).
      type: string
      pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
    chart:
      title: Chart Source
      description: Where the Helm chart and its values file live.
      type: object
      properties:
        repo_url:
          title: Charts Repo URL
          description: Git URL of the Helm charts repository (SSH or HTTPS).
          type: string
        revision:
          title: Target Revision
          description: Branch, tag, or commit of the charts repo to track. HEAD follows the repository's
            default branch.
          type: string
          default: HEAD
        path:
          title: Chart Path
          description: Path to the Helm chart within the charts repo.
          type: string
        values_path:
          title: Values Path
          description: Values file path, relative to the chart directory. Supports ${blueprint.self.variables.*}
            expressions.
          type: string
        release_name:
          title: Helm Release Name
          description: Helm release name for the generated Application. Defaults to the blueprint resource
            name. Together with the target namespace this is the key facets-argo-shim matches on.
          type: string
      required:
      - repo_url
      - path
    release:
      title: Release
      description: Container image for this service, when supplied by a Facets artifact.
      type: object
      properties:
        image:
          title: Image
          description: Full container image URI. Normally set by the wired artifact rather than by hand.
          type: string
          x-ui-skip: true
        image_values_path:
          title: Image Values Path
          description: Dot-path in the chart's values where the image should be injected, e.g. `myapp.image`.
            Leave empty to not inject it at all.
          type: string
    sync_policy:
      title: Sync Policy
      description: How Argo reconciles this Application.
      type: object
      properties:
        automated:
          title: Automated Sync
          description: Let Argo sync automatically instead of requiring a manual sync.
          type: boolean
          default: true
        auto_prune:
          title: Auto Prune
          description: Delete resources that no longer exist in the chart. Adds PrunePropagationPolicy=foreground.
          type: boolean
          default: false
        self_heal:
          title: Self Heal
          description: 'Reconcile the live state back to the rendered manifests. REQUIRED for Facets-side
            value changes to reach the workload: a changed ${facets:...} value alters the render, which
            Argo sees as drift rather than a source change, and Argo''s automated block alone will not
            reconcile drift. With this off the app sits OutOfSync indefinitely (verified). Also reverts
            genuine manual kubectl edits.'
          type: boolean
          default: true
        preserve_on_delete:
          title: Preserve Resources on Deletion
          description: Keep the deployed workloads when the ApplicationSet itself is deleted. Safe default
            - turn off deliberately.
          type: boolean
          default: true
        retry:
          title: Retry
          description: Retry behaviour for failed syncs.
          type: object
          properties:
            limit:
              title: Retry Limit
              description: Number of sync retries. 0 disables retrying.
              type: integer
              default: 5
              minimum: 0
              maximum: 100
      x-ui-toggle: true
    helm_values:
      title: Inline Helm Values
      description: Extra Helm values merged into the generated Application as spec.source.helm.valuesObject,
        on top of the values file. A ${facets:...} reference here must be written $${facets:...} - Terraform
        consumes the doubled dollar, leaving the single-dollar form the shim resolves.
      type: object
      x-ui-yaml-editor: true
    advanced:
      title: Advanced
      description: Escape hatches for Argo features the structured fields above do not model. Merged into
        the generated Application, so they can override anything the module builds.
      type: object
      x-ui-toggle: true
      properties:
        ignore_differences:
          title: Ignore Differences
          description: Argo `spec.ignoreDifferences` entries, for fields mutated outside Argo that should
            not show as drift.
          type: array
          items:
            type: object
        sync_options:
          title: Extra Sync Options
          description: Additional Argo syncOptions, appended to the module's own (CreateNamespace=true,
            and PrunePropagationPolicy when auto-pruning).
          type: array
          items:
            type: string
        application_overrides:
          title: Application Overrides
          description: Raw fragment deep-merged into the generated Application template spec, last. The
            full escape hatch for anything else Argo supports.
          type: object
          x-ui-yaml-editor: true
    annotations:
      title: Additional Annotations
      description: Extra annotations for the generated Application. The five facets.cloud/* shim annotations
        are always injected and cannot be overridden here.
      type: object
      patternProperties:
        ^[a-zA-Z0-9]([-a-zA-Z0-9_./]*[a-zA-Z0-9])?$:
          type: string
      x-ui-toggle: true
    facets_references:
      title: Facets References (shim-maintained)
      description: 'Written by the facets-argo-shim consumed-references callback: a per-environment list
        of ${...} expressions the last render consumed, at spec.facets_references.<env>.expressions. The
        Control Plane resolves them at release time and this module folds a digest of the resolved values
        into the Application, so a release that changes any referenced value re-renders the app. Not normally
        hand-edited.'
      type: object
      x-ui-yaml-editor: true
  required:
  - namespace
  - chart
  x-ui-order:
  - namespace
  - argocd_project
  - chart
  - release
  - sync_policy
  - helm_values
  - advanced
  - annotations
  - facets_references
sample:
  kind: service
  flavor: argo
  version: '1.0'
  spec:
    argocd_project: default
    namespace: bc
    chart:
      repo_url: git@bitbucket.org:coinswitch/charts.git
      revision: HEAD
      path: csk/thirdeye
      values_path: values.yaml
      release_name: ''
    release:
      image: ''
      image_values_path: ''
    sync_policy:
      automated: true
      auto_prune: false
      self_heal: true
      preserve_on_delete: true
      retry:
        limit: 5
    helm_values: {}
    advanced:
      ignore_differences: []
      sync_options: []
      application_overrides: {}
    annotations: {}
    facets_references: {}
