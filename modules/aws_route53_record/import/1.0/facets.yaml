intent: aws_route53_record
flavor: import
version: '1.0'
description: MANAGED true-import of existing AWS Route53 records (keyed map). Each record's
  zone, name, type, ttl and values are driven by an env override carrying the exact live
  spec so a plan against the live records is 0-change and they become Facets-managed.
intentDetails:
  type: Cloud & Infrastructure
  description: Managed zero-change import of existing Route53 records
  displayName: Route53 Records (Import Existing)
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/aws_route53_record.svg
clouds:
- aws
spec:
  type: object
  properties:
    records:
      type: object
      x-ui-yaml-editor: true
      title: Route53 records keyed by name (from live)
      x-ui-overrides-only: true
inputs:
  cloud_account:
    type: '@facets/aws_cloud_account_local'
    displayName: Cloud Account
    description: The AWS Cloud Account the records live in
    optional: false
    providers:
    - aws
outputs:
  default:
    type: '@facets/aws_route53_record'
sample:
  kind: aws_route53_record
  flavor: import
  version: '1.0'
  spec: {}
iac:
  validated_files:
  - variables.tf
