intent: helm
flavor: import
version: '1.0'
description: MANAGED true-import of an existing Helm release. Chart, repository, version,
  namespace, release name, the release flags (create_namespace/max_history/wait/cleanup_on_fail/atomic/timeout)
  and the rendered values (pushed verbatim as the exact string captured from the live release)
  are driven by an env override carrying the live spec, so the release becomes Facets-managed
  with no chart/version/namespace/values change. The helm provider never reads values back on
  import, so the first plan shows a structural `+ values` populate only.
intentDetails:
  type: Kubernetes Resources
  description: Managed zero-change import of an existing Helm release
  displayName: Helm (Import Existing)
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/helm.svg
clouds:
- aws
- azure
- gcp
- kubernetes
inputs:
  kubernetes_details:
    type: '@facets/kubernetes-details'
    displayName: Kubernetes Cluster
    optional: false
    default:
      resource_type: kubernetes_cluster
      resource_name: default
    providers:
    - kubernetes
    - kubernetes-alpha
    - helm
spec:
  type: object
  properties:
    helm:
      type: object
      title: Helm release config (from live)
      x-ui-overrides-only: true
    values:
      type: string
      title: Rendered values (verbatim from live, single document)
      x-ui-overrides-only: true
      x-ui-yaml-editor: true
    values_b64:
      type: string
      title: Rendered values list (base64 of JSON array, verbatim from live)
      x-ui-overrides-only: true
outputs:
  default:
    type: '@facets/helm'
sample:
  kind: helm
  flavor: import
  version: '1.0'
  spec: {}
iac:
  validated_files:
  - variables.tf
