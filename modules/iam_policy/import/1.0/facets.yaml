intent: iam_policy
flavor: import
version: '1.0'
description: MANAGED true-import of an existing customer-managed AWS IAM policy. Name,
  path, policy JSON document and tags are driven by an env override carrying the exact
  live spec so a plan against the live policy is 0-change and it becomes Facets-managed.
intentDetails:
  type: Security
  description: Managed zero-change import of an existing AWS IAM policy
  displayName: IAM Policy (Import Existing)
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/iam_policy.svg
clouds:
- aws
spec:
  type: object
  properties:
    policy_config:
      type: object
      x-ui-yaml-editor: true
      title: IAM policy config (from live)
      x-ui-overrides-only: true
inputs:
  cloud_account:
    type: '@facets/aws_cloud_account'
    displayName: Cloud Account
    description: The AWS Cloud Account the policy lives in
    optional: false
    providers:
    - aws
outputs:
  default:
    type: '@facets/iam_policy'
sample:
  kind: iam_policy
  flavor: import
  version: '1.0'
  spec: {}
iac:
  validated_files:
  - variables.tf
