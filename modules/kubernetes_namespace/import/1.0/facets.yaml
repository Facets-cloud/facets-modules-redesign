intent: kubernetes_namespace
flavor: import
version: '1.0'
description: MANAGED true-import of existing Kubernetes Namespaces. Keyed by name; labels/annotations
  are driven by an env override carrying the exact live metadata so a plan against the live cluster is
  0-change and the namespaces become Facets-managed. The k8s-injected kubernetes.io/metadata.name label
  is ignored (NamespaceLifecycle admission manages it).
intentDetails:
  type: Kubernetes Resources
  description: Zero-change import of existing Kubernetes Namespaces
  displayName: Namespace (Import Existing)
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/k8s_resource.svg
clouds:
- aws
- azure
- gcp
- kubernetes
inputs:
  kubernetes_details:
    type: '@facets/kubernetes-details'
    displayName: Kubernetes Cluster
    optional: false
    default:
      resource_type: kubernetes_cluster
      resource_name: default
    providers:
    - kubernetes
    - kubernetes-alpha
    - helm
outputs:
  default:
    type: '@facets/k8s_resource'
    title: Namespace Details
spec:
  title: Namespaces
  description: Kubernetes Namespaces to adopt (import) into Facets management.
  type: object
  properties:
    namespaces:
      type: object
      title: Namespaces
      description: Map of Namespace name to definition.
      patternProperties:
        ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$:
          type: object
          title: Namespace
          properties:
            metadata:
              type: object
              title: Metadata
              properties:
                labels:
                  type: object
                  title: Labels
                  x-ui-yaml-editor: true
                annotations:
                  type: object
                  title: Annotations
                  x-ui-yaml-editor: true
  required:
  - namespaces
sample:
  kind: kubernetes_namespace
  flavor: import
  version: '1.0'
  disabled: false
  spec:
    namespaces:
      facets: {}
iac:
  validated_files:
  - variables.tf
