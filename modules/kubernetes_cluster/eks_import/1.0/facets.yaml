intent: kubernetes_cluster
flavor: eks_import
version: '1.0'
description: MANAGED true-import of an existing AWS EKS cluster built with self-managed
  node groups (ASG + launch template). Every attribute is driven by an env override
  carrying the exact live spec (version, subnets, sg/role names, addon versions, launch
  templates, ASGs, KMS) so a plan against the live cluster is 0-change and the resources
  become Facets-managed. Emits the same @facets/kubernetes-details + @facets/eks contract
  as eks_standard so downstream helm/k8s modules bind unchanged.
intentDetails:
  type: Cloud & Infrastructure
  description: Managed zero-change import of an existing AWS EKS cluster
  displayName: Kubernetes Cluster (Import Existing)
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/kubernetes_cluster.svg
clouds:
- aws
spec:
  type: object
  title: EKS Import Spec (all fields override-only, populated from live)
  properties:
    cluster:
      type: object
      title: EKS control plane config
      x-ui-overrides-only: true
    cluster_role:
      type: object
      title: Cluster IAM role
      x-ui-overrides-only: true
    workers_role:
      type: object
      title: Workers IAM role
      x-ui-overrides-only: true
    elb_sl_policy:
      type: object
      title: ELB service-linked-role creation policy
      x-ui-overrides-only: true
    cluster_policy_arns:
      type: array
      title: Cluster role policy ARNs
      items:
        type: string
      x-ui-overrides-only: true
    workers_policy_arns:
      type: array
      title: Workers role policy ARNs
      items:
        type: string
      x-ui-overrides-only: true
    cluster_sg:
      type: object
      title: Cluster security group
      x-ui-overrides-only: true
    workers_sg:
      type: object
      title: Workers security group
      x-ui-overrides-only: true
    sg_rules:
      type: array
      title: Security group rules
      items:
        type: object
      x-ui-overrides-only: true
    launch_templates:
      type: object
      title: Worker launch templates (keyed)
      x-ui-overrides-only: true
    asgs:
      type: object
      title: Worker autoscaling groups (keyed)
      x-ui-overrides-only: true
    instance_profiles:
      type: object
      title: Worker instance profiles (keyed)
      x-ui-overrides-only: true
    addons:
      type: object
      title: EKS add-ons (keyed)
      x-ui-overrides-only: true
    oidc:
      type: object
      title: OIDC provider
      x-ui-overrides-only: true
    kms:
      type: object
      title: Secrets KMS key
      x-ui-overrides-only: true
inputs:
  cloud_account:
    type: '@facets/aws_cloud_account'
    displayName: Cloud Account
    description: The AWS Cloud Account the EKS cluster lives in
    optional: false
    providers:
    - aws
  network_details:
    type: '@facets/aws-vpc-details'
    displayName: Network
    description: The VPC the cluster lives in
    default:
      resource_name: default
      resource_type: network
outputs:
  default:
    type: '@facets/eks'
    title: EKS Cluster Attributes
    description: Additional EKS cluster attributes without provider configuration
  attributes:
    type: '@facets/kubernetes-details'
    title: Kubernetes Cluster Output
    providers:
      helm:
        source: hashicorp/helm
        version: 2.17.0
        attributes:
          kubernetes:
            cluster_ca_certificate: cluster_ca_certificate
            host: cluster_endpoint
            exec:
              api_version: kubernetes_provider_exec.api_version
              args: kubernetes_provider_exec.args
              command: kubernetes_provider_exec.command
      kubernetes:
        source: hashicorp/kubernetes
        version: 2.38.0
        attributes:
          cluster_ca_certificate: cluster_ca_certificate
          host: cluster_endpoint
          exec:
            api_version: kubernetes_provider_exec.api_version
            args: kubernetes_provider_exec.args
            command: kubernetes_provider_exec.command
      kubernetes-alpha:
        source: hashicorp/kubernetes-alpha
        version: 0.6.0
        attributes:
          cluster_ca_certificate: cluster_ca_certificate
          host: cluster_endpoint
          exec:
            api_version: kubernetes_provider_exec.api_version
            args: kubernetes_provider_exec.args
            command: kubernetes_provider_exec.command
sample:
  kind: kubernetes_cluster
  flavor: eks_import
  version: '1.0'
  spec: {}
iac:
  validated_files:
  - variables.tf
