clouds:
    - aws
description: |
    Creates an AWS EKS cluster with managed node groups using the official terraform-aws-eks module.
    This flavor does NOT support EKS Auto Mode - for Auto Mode support, use the eks_auto flavor.
intentDetails:
  type: Cloud & Infrastructure
  description: AWS EKS cluster with standard configuration and all necessary settings preset
  displayName: Kubernetes Cluster
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/kubernetes_cluster.svg
flavor: eks_import
inputs:
    cloud_account:
        description: The AWS Cloud Account where the EKS cluster will be created
        displayName: Cloud Account
        optional: false
        providers:
            - aws
        type: '@facets/aws_cloud_account'
    network_details:
        default:
            resource_name: default
            resource_type: network
        displayName: Network
        type: '@facets/aws-vpc-details'
intent: kubernetes_cluster
outputs:
    attributes:
        providers:
            helm:
                attributes:
                    kubernetes:
                        cluster_ca_certificate: cluster_ca_certificate
                        exec:
                            api_version: kubernetes_provider_exec.api_version
                            args: kubernetes_provider_exec.args
                            command: kubernetes_provider_exec.command
                        host: cluster_endpoint
                source: hashicorp/helm
                version: 2.17.0
            kubernetes:
                attributes:
                    cluster_ca_certificate: cluster_ca_certificate
                    exec:
                        api_version: kubernetes_provider_exec.api_version
                        args: kubernetes_provider_exec.args
                        command: kubernetes_provider_exec.command
                    host: cluster_endpoint
                source: hashicorp/kubernetes
                version: 2.38.0
            kubernetes-alpha:
                attributes:
                    cluster_ca_certificate: cluster_ca_certificate
                    exec:
                        api_version: kubernetes_provider_exec.api_version
                        args: kubernetes_provider_exec.args
                        command: kubernetes_provider_exec.command
                    host: cluster_endpoint
                source: hashicorp/kubernetes-alpha
                version: 0.6.0
        title: Kubernetes Cluster Output
        type: '@facets/kubernetes-details'
    default:
        description: Additional EKS cluster attributes without provider configuration
        title: EKS Cluster Attributes
        type: '@facets/eks'
sample:
    disabled: false
    flavor: eks_import
    kind: kubernetes_cluster
    spec:
        cluster_addons:
            coredns:
                enabled: true
                version: latest
            ebs_csi:
                enabled: true
                version: latest
            kube_proxy:
                enabled: true
                version: latest
            metrics_server:
                enabled: true
                version: latest
            vpc_cni:
                enabled: true
                version: latest
        cluster_endpoint_private_access: true
        cluster_endpoint_public_access: true
        cluster_version: "1.36"
        customer_managed_kms: true
    version: "2.0"
spec:
    description: Configure your Amazon EKS cluster with managed node groups
    properties:
        node_subnet_ids:
            description: Override subnet IDs for the managed node group (defaults to the network's private subnets). Use to pin nodes to specific NAT-egress private subnets.
            title: Node Group Subnet IDs
            type: array
            items:
                type: string
            x-ui-overrides-only: true
        cluster_addons:
            description: Managed EKS add-ons configuration
            properties:
                additional_addons:
                    description: Additional custom EKS add-ons (e.g., aws-ebs-csi-driver, aws-efs-csi-driver, snapshot-controller)
                    patternProperties:
                        ^[a-zA-Z0-9_-]+$:
                            properties:
                                configuration_values:
                                    description: Optional JSON configuration values for the add-on
                                    title: Configuration Values (JSON)
                                    type: string
                                    x-ui-yaml-editor: true
                                enabled:
                                    default: true
                                    description: Enable this add-on
                                    title: Enabled
                                    type: boolean
                                service_account_role_arn:
                                    description: Optional IAM role ARN for the add-on's service account (IRSA)
                                    title: Service Account Role ARN
                                    type: string
                                    x-ui-placeholder: arn:aws:iam::123456789012:role/addon-role
                                version:
                                    description: Version of the add-on (use 'latest' for latest version)
                                    title: Version
                                    type: string
                                    x-ui-placeholder: latest
                            type: object
                    title: Additional Add-ons
                    type: object
                    x-ui-yaml-editor: true
                coredns:
                    properties:
                        enabled:
                            default: true
                            title: Enable CoreDNS
                            type: boolean
                        version:
                            default: latest
                            title: Version
                            type: string
                            x-ui-visible-if:
                                field: spec.cluster_addons.coredns.enabled
                                values:
                                    - true
                    title: CoreDNS
                    type: object
                ebs_csi:
                    properties:
                        enabled:
                            default: true
                            title: Enable EBS CSI Driver
                            type: boolean
                        version:
                            default: latest
                            title: Version
                            type: string
                            x-ui-visible-if:
                                field: spec.cluster_addons.ebs_csi.enabled
                                values:
                                    - true
                    title: EBS CSI Driver
                    type: object
                kube_proxy:
                    properties:
                        enabled:
                            default: true
                            title: Enable Kube Proxy
                            type: boolean
                        version:
                            default: latest
                            title: Version
                            type: string
                            x-ui-visible-if:
                                field: spec.cluster_addons.kube_proxy.enabled
                                values:
                                    - true
                    title: Kube Proxy
                    type: object
                metrics_server:
                    properties:
                        enabled:
                            default: true
                            title: Enable Metrics Server
                            type: boolean
                        version:
                            default: latest
                            title: Version
                            type: string
                            x-ui-visible-if:
                                field: spec.cluster_addons.metrics_server.enabled
                                values:
                                    - true
                    title: Metrics Server
                    type: object
                vpc_cni:
                    properties:
                        enabled:
                            default: true
                            title: Enable VPC CNI
                            type: boolean
                        version:
                            default: latest
                            title: Version
                            type: string
                            x-ui-visible-if:
                                field: spec.cluster_addons.vpc_cni.enabled
                                values:
                                    - true
                    title: VPC CNI
                    type: object
            title: EKS Add-ons
            type: object
            x-ui-toggle: true
        cluster_endpoint_private_access:
            default: true
            description: Whether the cluster API server endpoint is accessible from within the VPC
            title: Enable Private Endpoint Access
            type: boolean
            x-ui-overrides-only: true
        cluster_endpoint_public_access:
            default: true
            description: Whether the cluster API server endpoint is accessible from the internet
            title: Enable Public Endpoint Access
            type: boolean
            x-ui-overrides-only: true
        cluster_tags:
            description: Additional tags for the EKS cluster
            title: Cluster Tags
            type: object
            x-ui-yaml-editor: true
        cluster_version:
            default: "1.36"
            description: EKS Kubernetes version
            enum:
                - "1.28"
                - "1.29"
                - "1.30"
                - "1.31"
                - "1.32"
                - "1.33"
                - "1.34"
                - "1.35"
                - "1.36"
            title: Kubernetes Version
            type: string
            x-ui-overrides-only: true
        default_node_pool:
            description: Default system node pool configuration for running system workloads (CoreDNS, Karpenter, etc.)
            properties:
                capacity_type:
                    default: ON_DEMAND
                    description: Type of capacity for the default system node pool
                    enum:
                        - ON_DEMAND
                        - SPOT
                    title: Capacity Type
                    type: string
                disk_size:
                    default: 50
                    description: Disk size in GB for default system nodes
                    maximum: 1000
                    minimum: 20
                    title: Disk Size (GB)
                    type: integer
                instance_types:
                    default:
                        - t3.medium
                    description: List of EC2 instance types for the default system node pool
                    items:
                        type: string
                    title: Instance Types
                    type: array
                size:
                    default: 2
                    description: Number of nodes in the default system pool
                    minimum: 1
                    title: Node Count
                    type: integer
            title: Default System Node Pool
            type: object
            x-ui-toggle: true
        container_insights_enabled:
            default: false
            description: Enable CloudWatch Container Insights for cluster monitoring.
            title: Container Insights
            type: boolean
        cloudwatch_agent_policies:
            type: object
            title: CloudWatch Agent IAM Policies
            description: Additional IAM policy ARNs to attach to the CloudWatch Agent IRSA role (e.g., for X-Ray, custom metrics)
            x-ui-visible-if:
                field: spec.container_insights_enabled
                values:
                    - true
            patternProperties:
                ^[a-zA-Z0-9_.-]*$:
                    title: Policy Name
                    type: object
                    properties:
                        arn:
                            title: ARN
                            type: string
                            pattern: ^(arn:aws:iam::(\d{12}|aws):policy\/[A-Za-z0-9+=,.@\-_]+|\$\{[A-Za-z0-9._-]+\})$
                            x-ui-placeholder: 'IAM policy ARN. Eg: arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess'
                            x-ui-error-message: 'Value doesn''t match pattern, accepted value pattern Eg: arn:aws:iam::123456789012:policy/policy1'
                            x-ui-output-type: iam_policy_arn
                            x-ui-typeable: true
                    required:
                        - arn
        customer_managed_kms:
            default: true
            description: Use a customer-managed KMS key for Kubernetes secrets encryption. Required for compliance (PCI-DSS, HIPAA). EKS always encrypts secrets with AWS-owned keys by default.
            title: Customer-Managed KMS Key
            type: boolean
        enabled_log_types:
            default:
                - api
                - audit
                - authenticator
                - controllerManager
                - scheduler
            description: List of EKS control plane log types to enable. All types enabled by default for security and compliance.
            items:
                enum:
                    - api
                    - audit
                    - authenticator
                    - controllerManager
                    - scheduler
                type: string
            title: Enabled Control Plane Log Types
            type: array
            x-ui-overrides-only: true
        cluster_name_override:
            description: Existing EKS cluster name to import (leave empty to auto-generate a new cluster).
            title: Cluster Name (import existing)
            type: string
            x-ui-overrides-only: true
        node_iam_role_arn_override:
            description: ARN of the existing node IAM role (referenced, not managed); surfaced in outputs for consumers.
            title: Node IAM Role ARN (existing)
            type: string
            x-ui-overrides-only: true
        cluster_security_group_id:
            description: Existing cluster security group id to reference when create_cluster_sg is false (import).
            title: Cluster Security Group ID (existing)
            type: string
            x-ui-overrides-only: true
        cluster_iam_role_arn:
            description: Existing cluster IAM role ARN to reference when create_cluster_iam_role is false (import).
            title: Cluster IAM Role ARN (existing)
            type: string
            x-ui-overrides-only: true
        authentication_mode:
            default: API_AND_CONFIG_MAP
            description: EKS access authentication mode. Set to CONFIG_MAP to match a legacy imported cluster.
            title: Authentication Mode
            type: string
            x-ui-overrides-only: true
        control_plane_subnet_ids:
            description: Existing control-plane subnet IDs (match live on import; leave empty for new clusters).
            title: Control Plane Subnet IDs (existing)
            type: array
            items:
                type: string
            x-ui-overrides-only: true
        service_ipv4_cidr:
            description: Existing cluster service IPv4 CIDR (match live on import; leave empty for new clusters).
            title: Service IPv4 CIDR (existing)
            type: string
            x-ui-overrides-only: true
        create_cluster_iam_role:
            default: true
            description: Manage the cluster IAM role. Set false to reference an existing role via cluster_iam_role_arn (import).
            title: Manage Cluster IAM Role
            type: boolean
            x-ui-overrides-only: true
        node_security_group_id:
            description: Existing node security group id to reference when create_node_sg is false (import).
            title: Node Security Group ID (existing)
            type: string
            x-ui-overrides-only: true
        kms_key_arn:
            description: Existing KMS key ARN for secrets encryption (used when create_kms_alias is false).
            title: KMS Key ARN (existing)
            type: string
            x-ui-overrides-only: true
        create_kms_alias:
            default: true
            description: Manage the KMS key. Set false to reference an existing key via kms_key_arn (import).
            title: Manage KMS Key
            type: boolean
            x-ui-overrides-only: true
        create_cluster_sg:
            default: true
            description: Let the module manage the cluster security group.
            title: Manage Cluster Security Group
            type: boolean
            x-ui-overrides-only: true
        create_node_sg:
            default: true
            description: Let the module manage the node security group.
            title: Manage Node Security Group
            type: boolean
            x-ui-overrides-only: true
        create_sg_rules:
            default: true
            description: Add the module's recommended/extra SG rules. Set false on import to leave live rules untouched.
            title: Manage SG Rules
            type: boolean
            x-ui-overrides-only: true
        create_primary_sg_tags:
            default: true
            description: Manage tags on the EKS-created cluster primary security group.
            title: Manage Primary SG Tags
            type: boolean
            x-ui-overrides-only: true
        create_ebs_csi_driver_role:
            default: true
            description: Create the EBS CSI driver IRSA role and addon. Set false on import.
            title: Manage EBS CSI Driver Role
            type: boolean
            x-ui-overrides-only: true
        enable_access_entries:
            default: true
            description: Grant the cluster creator admin access-entry permissions. Set false on import.
            title: Enable Access Entries
            type: boolean
            x-ui-overrides-only: true
        enable_eks_auto_mode:
            default: false
            description: Enable EKS Auto Mode custom tags.
            title: Enable EKS Auto Mode
            type: boolean
            x-ui-overrides-only: true
    required:
        - cluster_version
    title: EKS Cluster Configuration
    type: object
    x-ui-order:
        - node_subnet_ids
        - cluster_version
        - cluster_endpoint_public_access
        - cluster_endpoint_private_access
        - customer_managed_kms
        - enabled_log_types
        - container_insights_enabled
        - cloudwatch_agent_policies
        - cluster_addons
        - default_node_pool
        - cluster_tags
        - cluster_name_override
        - node_iam_role_arn_override
        - cluster_security_group_id
        - node_security_group_id
        - cluster_iam_role_arn
        - create_cluster_iam_role
        - authentication_mode
        - service_ipv4_cidr
        - control_plane_subnet_ids
        - kms_key_arn
        - create_kms_alias
        - create_cluster_sg
        - create_node_sg
        - create_sg_rules
        - create_primary_sg_tags
        - create_ebs_csi_driver_role
        - enable_access_entries
        - enable_eks_auto_mode
version: "2.0"
