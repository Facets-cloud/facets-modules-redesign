intent: k8s_resource
flavor: import
version: '1.0'
description: MANAGED true-import of existing Facets k8s_resource objects. In live these are deployed
  as Helm releases of the pass-through "dynamic-k8s-resource(s)" chart (the legacy any-k8s-resource
  wrapper), so this flavor imports them as the same helm_release type, keyed by release name. The
  chart is vendored so the rendered manifest reproduces live exactly; the release name, namespace and
  the verbatim values are driven by an env override carrying the live spec. The helm provider never
  reads values back on import, so the first plan shows a structural `+ values` populate only.
intentDetails:
  type: Kubernetes Resources
  description: Managed zero-change import of existing Facets k8s_resource (any-k8s-resource) releases
  displayName: K8s Resource (Import Existing)
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/k8s_resource.svg
clouds:
- aws
- azure
- gcp
- kubernetes
inputs:
  kubernetes_details:
    type: '@facets/kubernetes-details'
    displayName: Kubernetes Cluster
    optional: false
    default:
      resource_type: kubernetes_cluster
      resource_name: default
    providers:
    - kubernetes
    - kubernetes-alpha
    - helm
spec:
  type: object
  properties:
    releases:
      type: object
      x-ui-yaml-editor: true
      title: Helm releases to adopt (from live)
      description: Map of Helm release name to {name, namespace, chart_kind, cleanup_on_fail, values_b64}.
      x-ui-overrides-only: true
outputs:
  default:
    type: '@facets/k8s_resource'
sample:
  kind: k8s_resource
  flavor: import
  version: '1.0'
  spec:
    releases: {}
iac:
  validated_files:
  - variables.tf
