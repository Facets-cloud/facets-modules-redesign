intent: ecs_service
flavor: aws
version: '1.0'
description: Deploy a containerized workload as an AWS ECS Fargate service.
intentDetails:
  type: Cloud & Infrastructure
  description: Run an application container on AWS ECS Fargate.
  displayName: ECS Service
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/service.svg
clouds: [aws]
artifact_inputs:
  primary:
    attribute_path: spec.release.image
    artifact_type: docker_image
inputs:
  cloud_account:
    type: '@facets/aws_cloud_account'
    displayName: Cloud Account
    optional: false
    providers: [aws]
  network_details:
    type: '@facets/aws-vpc-details'
    displayName: Network
    optional: false
  ecs_details:
    type: '@facets/ecs-cluster'
    displayName: ECS Cluster
    optional: false
spec:
  title: ECS Service
  type: object
  properties:
    runtime:
      type: object
      title: Runtime
      properties:
        ports:
          type: object
          title: Ports
          x-ui-yaml-editor: true
          patternProperties:
            '^[a-zA-Z0-9_-]+$':
              type: object
              properties:
                port: {type: string, pattern: '^[1-9][0-9]{0,4}$'}
                service_port: {type: string, pattern: '^[1-9][0-9]{0,4}$'}
                protocol: {type: string, enum: [tcp, udp]}
              required: [port, protocol]
        size:
          type: object
          properties:
            cpu: {type: integer, minimum: 1}
            memory: {type: integer, minimum: 1}
          required: [cpu, memory]
        command: {type: array, items: {type: string}}
        args: {type: array, items: {type: string}}
        readonly_root_filesystem: {type: boolean, default: true}
        autoscaling:
          type: object
          properties:
            min: {type: integer, minimum: 1, default: 1}
            max: {type: integer, minimum: 1, default: 1}
          required: [min, max]
      required: [ports, size]
    release:
      type: object
      properties:
        image: {type: string, x-ui-skip: true}
        registry_name: {type: string, default: ''}
      required: [image]
    env:
      type: object
      title: Environment Variables
      x-ui-yaml-editor: true
      patternProperties:
        '^[a-zA-Z][a-zA-Z0-9_.-]*$': {type: string}
    cloud_permissions:
      type: object
      x-ui-toggle: true
      properties:
        aws:
          type: object
          properties:
            iam_policies:
              type: object
              x-ui-yaml-editor: true
    advanced:
      type: object
      x-ui-toggle: true
      x-ui-yaml-editor: true
  required: [runtime, release, env]
sample:
  kind: ecs_service
  flavor: aws
  version: '1.0'
  spec:
    runtime:
      ports:
        http: {port: '80', service_port: '80', protocol: tcp}
      size: {cpu: 512, memory: 1}
      readonly_root_filesystem: true
    release: {image: ''}
    env: {}
outputs:
  default:
    type: '@facets/ecs-service'
