intent: s3
flavor: import
version: '1.0'
description: MANAGED true-import of an existing AWS S3 bucket. Bucket name, tags and
  the split sub-resources the live bucket actually has (versioning, server-side
  encryption) are driven by an env override carrying the exact live spec so a plan
  against the live bucket is 0-change and it becomes Facets-managed.
intentDetails:
  type: Storage
  description: Managed zero-change import of an existing AWS S3 bucket
  displayName: S3 Bucket (Import Existing)
  iconUrl: https://raw.githubusercontent.com/Facets-cloud/facets-modules-redesign/main/icons/s3.svg
clouds:
- aws
spec:
  type: object
  properties:
    bucket:
      type: object
      x-ui-yaml-editor: true
      title: S3 bucket config (from live)
      x-ui-overrides-only: true
inputs:
  cloud_account:
    type: '@facets/aws_cloud_account'
    displayName: Cloud Account
    description: The AWS Cloud Account the bucket lives in
    optional: false
    providers:
    - aws
outputs:
  default:
    type: '@facets/s3'
sample:
  kind: s3
  flavor: import
  version: '1.0'
  spec: {}
iac:
  validated_files:
  - variables.tf
